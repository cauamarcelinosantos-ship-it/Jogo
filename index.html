<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entrar | Jogo</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="login-page">
            <section class="login-panel" aria-labelledby="login-title">
                <div class="brand-mark" aria-hidden="true">J</div>
                <p class="eyebrow">Jogo</p>
                <h1 id="login-title">Bem-vindo de volta</h1>
                <p class="intro">Entre para continuar sua jornada.</p>

                <form class="login-form" action="#" method="post">
                    <div class="field-group">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
                    </div>

                    <div class="field-group">
                        <div class="label-row">
                            <label for="password">Senha</label>
                            <a href="#">Esqueci minha senha</a>
                        </div>
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
                    </div>

                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Manter-me conectado</span>
                    </label>

                    <button type="submit">Entrar <span aria-hidden="true">&#8594;</span></button>
                </form>

                <p class="signup">Ainda não tem uma conta? <a href="#">Criar conta</a></p>
            </section>

            <aside class="login-art" aria-label="Destaque do jogo">
                <div class="art-copy">
                    <span class="art-tag">Sua próxima aventura</span>
                    <p>Explore novos mundos.<br><strong>Escreva sua história.</strong></p>
                </div>
                <div class="sun" aria-hidden="true"></div>
                <div class="mountain mountain-back" aria-hidden="true"></div>
                <div class="mountain mountain-front" aria-hidden="true"></div>
            </aside>
        </main>
    </body>
</html>
