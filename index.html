<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jogo | Acesse sua aventura</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="game-page">
            <section class="login-panel" id="login-panel" aria-labelledby="login-title">
                <div class="brand-lockup"><div class="brand-mark" aria-hidden="true">J</div><strong>Jogo</strong></div>
                <p class="eyebrow" id="form-mode-label">Acesso ao jogo</p>
                <h1 id="login-title">Entre na sua aventura.</h1>
                <p class="intro" id="form-intro">Seu progresso espera por você.</p>

                <form class="login-form" id="auth-form" novalidate>
                    <div class="field-group">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
                    </div>

                    <div class="field-group">
                        <div class="label-row">
                            <label for="password">Senha</label>
                            <a href="#" id="forgot-password">Esqueci minha senha</a>
                        </div>
                        <div class="password-field">
                            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mínimo de 6 caracteres" minlength="6" required>
                            <button class="password-toggle" type="button" id="password-toggle" aria-label="Mostrar senha">Mostrar</button>
                        </div>
                    </div>

                    <label class="remember-me" id="remember-label">
                        <input type="checkbox" name="remember" checked>
                        Lembrar de mim neste dispositivo
                    </label>

                    <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
                    <button class="submit-button" type="submit" id="submit-button">
                        <span id="submit-label">Entrar</span><span aria-hidden="true">&#8594;</span>
                    </button>
                </form>

                <p class="signup" id="switch-mode-text">Ainda não tem uma conta? <a href="#" id="switch-mode">Criar conta</a></p>
            </section>

            <section class="session-panel" id="session-panel" hidden aria-labelledby="session-title">
                <div class="brand-lockup"><div class="brand-mark" aria-hidden="true">J</div><strong>Jogo</strong></div>
                <p class="eyebrow">Sessão ativa</p>
                <h1 id="session-title">Sua aventura continua.</h1>
                <p class="intro" id="session-email"></p>
                <button class="submit-button" type="button" id="logout-button"><span>Sair da conta</span><span aria-hidden="true">&#8594;</span></button>
            </section>

            <aside class="login-art" aria-label="Destaque do jogo">
                <div class="art-copy">
                    <span class="art-tag">Sua próxima aventura</span>
                    <p>Explore novos mundos.<br><strong>Escreva sua história.</strong></p>
                </div>
                <div class="sun" aria-hidden="true"></div>
                <div class="mountain mountain-back" aria-hidden="true"></div>
                <div class="mountain mountain-front" aria-hidden="true"></div>
            </aside>
        </main>
        <script src="app.js"></script>
    </body>
</html>
